[project]
name = "puls"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.3",
    "platformdirs>=4.9.6",
]

[project.scripts]
puls = "puls.main:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cfn-lint>=1.38.1",
    "mypy>=1.17.1",
    "ruff>=0.12.7",
]
